services:
  # ──────────────────────────────────────────────────────
  # 1. Spring Boot Core Service (REST API & Frontend Portal)
  # ──────────────────────────────────────────────────────
  - type: web
    name: cms-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: cms-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: cms-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: cms-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: cms-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: cms-postgres
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: ANALYTICS_INTERNAL_KEY
        value: cms-internal-analytics-key-2026
      - key: ANALYTICS_URL
        fromService:
          type: web
          name: cms-analytics
          property: host

  # ──────────────────────────────────────────────────────
  # 2. FastAPI Analytics Microservice (ETL & ML Engine)
  # ──────────────────────────────────────────────────────
  - type: web
    name: cms-analytics
    runtime: docker
    dockerfilePath: analytics/Dockerfile
    dockerContext: analytics
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cms-postgres
          property: connectionString
      - key: INTERNAL_API_KEY
        value: cms-internal-analytics-key-2026
      - key: HOST
        value: 0.0.0.0

databases:
  # ──────────────────────────────────────────────────────
  # 3. PostgreSQL Managed Database
  # ──────────────────────────────────────────────────────
  - name: cms-postgres
    plan: free
    region: oregon
    databaseName: cms_db
    user: cms_app
