<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS — Enterprise Portal Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      background: radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
                  radial-gradient(circle at 90% 90%, rgba(6, 182, 212, 0.08) 0%, transparent 40%),
                  #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px 16px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #0f172a;
    }

    .login-wrapper {
      width: 100%;
      max-width: 460px;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-icon-wrapper {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.35);
    }

    .brand-icon-wrapper svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.6px;
      margin: 0 0 6px;
    }

    .brand-tagline {
      font-size: 13px;
      color: #64748b;
      margin: 0;
    }

    .login-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.05),
                  0 8px 10px -6px rgba(15, 23, 42, 0.02);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #475569;
      margin-bottom: 8px;
    }

    .input-field-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      color: #94a3b8;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .input-icon svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .text-input {
      width: 100%;
      padding: 12px 14px 12px 44px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      color: #0f172a;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .text-input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .text-input::placeholder {
      color: #94a3b8;
    }

    .btn-submit-login {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
      transition: all 0.2s ease;
      margin-top: 8px;
      font-family: inherit;
    }

    .btn-submit-login:hover {
      background: linear-gradient(135deg, #4338ca 0%, #3730a3 100%);
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
      transform: translateY(-1px);
    }

    .btn-submit-login:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .btn-submit-login svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .alert-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 12px 14px;
      color: #b91c1c;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .alert-error svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: #dc2626;
      stroke-width: 2;
      flex-shrink: 0;
    }

    .demo-credentials-section {
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px solid #f1f5f9;
    }

    .demo-heading {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: #64748b;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .demo-heading svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .demo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .demo-pill-btn {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .demo-pill-btn:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
      transform: translateY(-1px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .demo-icon-badge {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .demo-icon-badge svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .badge-admin { background: #fee2e2; color: #b91c1c; }
    .badge-manager { background: #e0e7ff; color: #4338ca; }
    .badge-employee { background: #ecfdf5; color: #047857; }

    .demo-role-text {
      font-size: 12px;
      font-weight: 700;
      color: #1e293b;
    }

    .demo-role-sub {
      font-size: 10px;
      color: #64748b;
      font-weight: 500;
    }

    .portal-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <!-- Brand Header -->
    <div class="brand-header">
      <div class="brand-icon-wrapper">
        <!-- Modern Geometric Corporate Symbol SVG -->
        <svg viewBox="0 0 24 24">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
      </div>
      <h1 class="brand-title">Company Management System</h1>
      <p class="brand-tagline">Corporate Operations, CRM & Business Intelligence Suite</p>
    </div>

    <!-- Main Light Card -->
    <div class="login-card">
      <div id="errorAlert" class="alert-error">
        <!-- Error Exclamation SVG -->
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="errorText">Invalid credentials provided.</span>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Corporate Email Address</label>
          <div class="input-field-wrapper">
            <span class="input-icon">
              <!-- Mail Envelope SVG -->
              <svg viewBox="0 0 24 24">
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
              </svg>
            </span>
            <input type="email" id="email" class="text-input" placeholder="user@company.com" required value="admin@company.com">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Account Password</label>
          <div class="input-field-wrapper">
            <span class="input-icon">
              <!-- Lock SVG -->
              <svg viewBox="0 0 24 24">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input type="password" id="password" class="text-input" placeholder="••••••••" required value="Admin@123">
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit-login">
          <span>Sign In to Workspace</span>
          <!-- Arrow Right SVG -->
          <svg viewBox="0 0 24 24">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <!-- One-click Demo Credentials Section -->
      <div class="demo-credentials-section">
        <div class="demo-heading">
          <!-- Key / Fingerprint SVG -->
          <svg viewBox="0 0 24 24">
            <path d="M21 2l-2 2m-1.5 1.5L16 7l-1.5-1.5L13 7l-1.5-1.5L10 7 7.5 4.5a5 5 0 1 0 7 7l6.5-6.5L21 2z"></path>
          </svg>
          <span>One-Click Quick Login Credentials</span>
        </div>
        <div class="demo-grid">
          <button type="button" class="demo-pill-btn" onclick="fillDemo('admin@company.com', 'Admin@123')">
            <div class="demo-icon-badge badge-admin">
              <!-- Shield SVG -->
              <svg viewBox="0 0 24 24">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              </svg>
            </div>
            <div class="demo-role-text">Admin</div>
            <div class="demo-role-sub">Full Superuser</div>
          </button>

          <button type="button" class="demo-pill-btn" onclick="fillDemo('manager@company.com', 'Manager@123')">
            <div class="demo-icon-badge badge-manager">
              <!-- Briefcase SVG -->
              <svg viewBox="0 0 24 24">
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
              </svg>
            </div>
            <div class="demo-role-text">Manager</div>
            <div class="demo-role-sub">CRUD &amp; Analytics</div>
          </button>

          <button type="button" class="demo-pill-btn" onclick="fillDemo('employee@company.com', 'Employee@123')">
            <div class="demo-icon-badge badge-employee">
              <!-- User Person SVG -->
              <svg viewBox="0 0 24 24">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            <div class="demo-role-text">Employee</div>
            <div class="demo-role-sub">Scorecard &amp; Ops</div>
          </button>
        </div>
      </div>
    </div>

    <!-- Portal Footer -->
    <div class="portal-footer">
      <span>Enterprise Single Sign-On &bull; Role-Based Access Control (RBAC)</span>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    function fillDemo(email, pass) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = pass;
      document.getElementById('loginForm').dispatchEvent(new Event('submit'));
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('errorAlert');
      const errText = document.getElementById('errorText');
      const submitBtn = document.getElementById('submitBtn');
      errBox.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <svg style="animation: spin 1s linear infinite;" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" stroke-dasharray="32" stroke-linecap="round"></circle>
        </svg>
        <span>Authenticating...</span>
      `;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Authentication failed. Please verify credentials.');
        }

        CMS.setAuth(data.token, {
          email: data.email,
          role: data.role,
          fullName: data.fullName,
          employeeId: data.employeeId
        });

        window.location.href = '/index.html';
      } catch (err) {
        errText.textContent = err.message;
        errBox.style.display = 'flex';
        submitBtn.disabled = false;
        submitBtn.innerHTML = `
          <span>Sign In to Workspace</span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        `;
      }
    });

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('expired')) {
      const errBox = document.getElementById('errorAlert');
      const errText = document.getElementById('errorText');
      errText.textContent = 'Your security session has expired. Please sign in again.';
      errBox.style.display = 'flex';
    }
  </script>
  <style>
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</body>
</html>
